# Перевірки якості на кожен push і PR (безкоштовно: GitHub Actions для публічних репозиторіїв).
# «Краще, а не гірше»:
#   - `make check` — те саме, що локально: ruff, guard, check-voices, усі тести (UI у Chrome з фейковим мікрофоном),
#     покриття Python не нижче fail_under (pyproject.toml);
#   - храповик: у PR fail_under не можна знизити відносно базової гілки.
# Версії дій закріплені SHA, залежностей — у requirements*.txt; оновлення пропонує Dependabot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - name: Храповик покриття (поріг не знижується)
        if: github.event_name == 'pull_request'
        run: |
          base=$(git show "origin/${{ github.base_ref }}:pyproject.toml" | sed -n 's/^fail_under = //p')
          head=$(sed -n 's/^fail_under = //p' pyproject.toml)
          echo "fail_under: base=$base head=$head"
          python -c "import sys; sys.exit(float('$head') < float('${base:-0}'))" \
            || { echo "::error::fail_under знижено з $base до $head"; exit 1; }
      - name: Guard (аудіо, ресурси гри, секрети) — швидка відмова до встановлення залежностей
        run: python tools/guard_no_audio.py
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: make setup-dev PYTHON311=python   # лише dev-залежності: PyCASC для тестів не потрібен
      - name: make check
        env:
          STUDIO_SCREENSHOT: ${{ runner.temp }}/studio.png
        run: |
          set +e
          make check 2>&1 | tee check.log
          rc=${PIPESTATUS[0]}
          { echo "## Покриття"; echo '```'; sed -n '/coverage:/,/Total coverage/p' check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Скріншот студії
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-screenshot
          path: ${{ runner.temp }}/studio.png
          if-no-files-found: ignore

  windows:
    # Швидкий набір на Windows (без Chrome e2e): перевіряє кросплатформність (шляхи, кодування, симлінки, run.py)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Залежності
        run: python tools/run.py setup --dev-only
      - name: verify
        shell: bash
        run: |
          set -o pipefail
          python tools/run.py verify 2>&1 | tee verify.log
      - name: Причина падіння (анотація — видно без входу в GitHub)
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "FAILED|Error|error:|assert|Traceback|^E  " verify.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=windows verify::${msg:-$(tail -40 verify.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
