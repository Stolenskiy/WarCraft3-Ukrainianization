# Безкоштовні PR з оновленнями закріплених (за SHA) дій і залежностей — CI перевірить кожен.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    groups:
      dev-tools: { patterns: ["pytest*", "ruff", "playwright"] }
      runtime: { patterns: ["*"], exclude-patterns: ["pytest*", "ruff", "playwright"] }
