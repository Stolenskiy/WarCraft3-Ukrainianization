# Конфіг інструментів якості (код проєкту — скрипти в tools/, не пакет).
[tool.ruff]
line-length = 120
target-version = "py311"
include = ["tools/*.py", "tools/studio/**/*.py", "tools/aistudio/**/*.py", "tools/ai_engines/*.py", "tests/**/*.py"]  # усі скрипти; vendored tools/fish-speech поза include

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# старі PoC-скрипти: printf-форматування та zip без strict не переписуємо без потреби
"tools/build_uk_maps.py" = ["UP031", "B905"]
"tools/casc_read.py" = ["UP031", "B905"]
"tools/wc3map.py" = ["UP031", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tools/studio", "tools/aistudio"]
branch = true

[tool.coverage.report]
# «Храповик»: CI падає, якщо покриття нижче. Покриття виросло → підніміть число (ніколи не знижуйте).
fail_under = 94
show_missing = true
skip_covered = true
