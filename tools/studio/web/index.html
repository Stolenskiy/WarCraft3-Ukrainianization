<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студія озвучки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 2 2%22%3E%3Crect width=%222%22 height=%221%22 fill=%22%230057b7%22/%3E%3Crect y=%221%22 width=%222%22 height=%221%22 fill=%22%23ffd700%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark">UA</span><span>Студія озвучки</span></div>
  <button id="unitBtn" class="unit-btn" title="Обрати юніт">
    <span class="avatar" id="unitAvatar"></span>
    <span class="unit-btn-text"><b id="unitTitle">…</b><small id="unitSub"></small></span>
    <span class="chev">▾</span>
  </button>
  <div class="overall" title="Затверджено по всій расі">
    <div class="overall-label"><span id="overallName"></span><b id="overallNum"></b></div>
    <div class="bar"><i id="overallBar"></i></div>
  </div>
  <div class="top-actions">
    <div class="seg mini" id="optLang" title="Якою мовою звучить оригінал"><span>Оригінал</span><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    <label class="switch" title="Копія для гри без тиші на початку й у кінці"><input type="checkbox" id="optTrim" checked><span></span>Обрізати тишу</label>
    <label class="switch" title="Програти дубль одразу після запису"><input type="checkbox" id="optAutoplay" checked><span></span>Слухати після запису</label>
    <button class="ghost" id="installBtn" title="Скопіювати обрані дублі в теку гри (з бекапом і відкатом)">Встановити в гру</button>
    <button class="ghost" id="openGameDir" title="Відкрити теку з файлами для гри">Файли для гри</button>
  </div>
</header>

<div id="unitPopover" class="popover" hidden>
  <div class="popover-inner" id="unitGrid"></div>
</div>

<div class="layout">
  <aside class="side">
    <details class="character" id="character">
      <summary>Характер і тембр</summary>
      <div id="traits"></div>
    </details>
    <details class="character eq" id="eqPanel">
      <summary>Еквалайзер</summary>
      <div id="eq"></div>
    </details>
    <div class="seg" id="filter">
      <button data-f="all" class="on">Усі</button>
      <button data-f="todo">Залишилось</button>
      <button data-f="done">Готові</button>
    </div>
    <ol class="cues" id="cues"></ol>
  </aside>

  <main class="main" id="main">
    <div class="empty">Завантаження…</div>
  </main>
</div>

<footer class="keys">
  <span><kbd>Пробіл</kbd> запис / стоп</span>
  <span><kbd>R</kbd> оригінал</span>
  <span><kbd>B</kbd> оригінал → останній дубль</span>
  <span><kbd>L</kbd> останній дубль</span>
  <span><kbd>↑</kbd><kbd>↓</kbd> репліки</span>
  <span><kbd>N</kbd> наступна незатверджена</span>
  <span><kbd>⌘Z</kbd> скасувати</span>
</footer>

<div id="installModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="installTitle">
  <div class="modal-box">
    <div class="modal-head"><h3 id="installTitle">Встановити в гру</h3><button class="ghost" id="installClose" title="Закрити (Esc)">✕</button></div>
    <div class="modal-body" id="installBody"></div>
    <div class="modal-foot">
      <button class="ghost danger" id="installUndo" title="Прибрати наші файли й повернути оригінали та симлінки">Прибрати з гри</button>
      <button class="btn primary" id="installGo">Встановити</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
